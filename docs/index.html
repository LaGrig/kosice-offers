<!doctype html>
<html lang='uk'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Košice Student Deals</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--card:var(--tg-theme-secondary-bg-color,#f2f3f5);--accent:var(--tg-theme-button-color,#2481cc);--accent-fg:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px 12px 40px}
h1{font-size:20px;margin:4px 0 10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:0;border-radius:999px;padding:7px 14px;background:var(--card);color:var(--fg);font:inherit}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.bar{display:flex;gap:8px;margin:8px 0 12px}
select{flex:1;border:0;border-radius:12px;padding:9px;background:var(--card);color:var(--fg);font:inherit}
.card{overflow-wrap:anywhere;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16px}
.meta{display:flex;justify-content:space-between;color:var(--hint);font-size:12px;margin-top:8px}
.go{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:12px;background:var(--accent);color:var(--accent-fg);text-decoration:none}
.pin{outline:1px dashed var(--hint)}
.rx{display:flex;gap:6px;margin-top:10px}
.rb{flex:1;border:0;border-radius:10px;padding:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.rb.on{background:var(--accent);color:var(--accent-fg)}
.rb[data-r=dead]{flex:2.4;font-size:14px}
.hint{color:var(--hint);font-size:12px;margin:-4px 0 10px}
.state{margin:2px 0 6px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.adm{display:inline-block;margin-top:10px;margin-left:6px;padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--fg);border:0;font:inherit;cursor:pointer;text-decoration:none}
.adm-top{flex:none;white-space:nowrap;border:0;border-radius:10px;padding:6px 10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.empty{color:var(--hint);text-align:center;margin-top:40px}
</style>
</head>
<body>
<div class='head'><h1 id='h1'></h1><button id='admBtn' class='adm-top' style='display:none'>⚙️ Адмінка</button></div>
<div class='row' id='chips'></div>
<div class='bar'>
<select id='sort'></select>
<select id='lang'><option value='uk'>Українська</option><option value='ru'>Русский</option><option value='en'>English</option><option value='sk'>Slovenčina</option></select>
</div>
<div class='hint' id='hint'></div>
<div id='list'></div>
<script>
const I18N = {
  uk: {
    title: 'Студентські знахідки Кошице',
    cats: {all:'Усе', food:'Їжа', games:'Ігри', events:'Події', places:'Місця', it_soft:'IT і софт', services:'Послуги', jobs:'Робота', study:'Навчання', other:'Інше'},
    sorts: {new:'Нові', rating:'Краще', ending:'Скоро закінчаться'},
    hint: 'Постав реакцію, щоб побачити оцінки інших студентів',
    empty: 'Поки нічого немає в цьому розділі',
    open: 'Відкрити',
    free: 'Безкоштовно',
    until: 'до',
    dead: 'Неактуально',
    err: 'Помилка: '
  },
  ru: {
    title: 'Студенческие находки Кошице',
    cats: {all:'Все', food:'Еда', games:'Игры', events:'События', places:'Места', it_soft:'IT и софт', services:'Услуги', jobs:'Работа', study:'Учёба', other:'Другое'},
    sorts: {new:'Новые', rating:'Лучшее', ending:'Скоро закончатся'},
    hint: 'Поставь реакцию, чтобы увидеть оценки других студентов',
    empty: 'Пока ничего нет в этом разделе',
    open: 'Открыть',
    free: 'Бесплатно',
    until: 'до',
    dead: 'Неактуально',
    err: 'Ошибка: '
  },
  en: {
    title: 'Košice Student Deals',
    cats: {all:'All', food:'Food', games:'Games', events:'Events', places:'Places', it_soft:'IT & Soft', services:'Services', jobs:'Jobs', study:'Study', other:'Other'},
    sorts: {new:'Newest', rating:'Best', ending:'Ending soon'},
    hint: 'React to see other students’ ratings',
    empty: 'Nothing in this category yet',
    open: 'Open',
    free: 'Free',
    until: 'until',
    dead: 'Outdated',
    err: 'Error: '
  },
  sk: {
    title: 'Študentské objavy Košice',
    cats: {all:'Všetko', food:'Jedlo', games:'Hry', events:'Udalosti', places:'Miesta', it_soft:'IT a softvér', services:'Služby', jobs:'Práca', study:'Štúdium', other:'Ostatné'},
    sorts: {new:'Najnovšie', rating:'Najlepšie', ending:'Čoskoro končia'},
    hint: 'Reaguj, aby si videl hodnotenia ostatných študentov',
    empty: 'V tejto kategórii zatiaľ nič nie je',
    open: 'Otvoriť',
    free: 'Zadarmo',
    until: 'do',
    dead: 'Neaktuálne',
    err: 'Chyba: '
  }
};
window.addEventListener('error', e => { const b = document.getElementById('list'); if (b) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = (I18N[lang] || I18N.uk).err + e.message + ' (' + e.lineno + ')'; b.append(d); } });
const T = window.Telegram && window.Telegram.WebApp;
if (T) { T.ready(); T.expand(); }
const store = {
  get(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const u = T && T.initDataUnsafe && T.initDataUnsafe.user;
const IS_ADMIN = Boolean(u && u.id === 331425564);
function openBot(param) {
  const url = 'https://t.me/StudhubKosiceBot?start=' + param;
  if (T && T.openTelegramLink) { T.openTelegramLink(url); if (T.close) T.close(); }
  else window.open(url, '_blank');
}
const tgLang = (u && u.language_code) || 'en';
let lang = store.get('lang', ['uk','ru','sk','en'].includes(tgLang) ? tgLang : 'en');
if (!I18N[lang]) lang = 'en';
let cat = 'all';
const sp = T && T.initDataUnsafe && T.initDataUnsafe.start_param;
if (sp && I18N.uk.cats[sp]) cat = sp;
let sort = store.get('sort', 'new');
if (!I18N.uk.sorts[sort]) sort = 'new';
let offers = [];
let links = [];
let mine = {};
let counts = {};
const EMO = {up:'👍', fire:'🔥', down:'👎', dead:'🚫'};
const RX = Object.entries(EMO);
const API = 'https://students-reactions.lagrig-tm.workers.dev';
function tr(){ return I18N[lang] || I18N.en; }
function label(id, k) {
  const n = mine[id] ? ((counts[id] || {})[k] || 0) : 0;
  return (k === 'dead' ? EMO[k] + ' ' + tr().dead : EMO[k]) + (n ? ' ' + n : '');
}
function cs(id) { const c = counts[id] || {}; return 2 * (c.fire || 0) + (c.up || 0) - (c.down || 0) - 3 * (c.dead || 0); }
function paint(row, id) {
  row.querySelectorAll('.rb').forEach(b => {
    const k = b.dataset.r;
    b.textContent = label(id, k);
    b.classList.toggle('on', mine[id] === k);
  });
}
function bump(id, from, to) {
  const c = counts[id] = counts[id] || {};
  if (from) c[from] = Math.max(0, (c[from] || 0) - 1);
  if (to) c[to] = (c[to] || 0) + 1;
}
function react(id, r, row) {
  const old = mine[id];
  const next = old === r ? null : r;
  mine[id] = next; bump(id, old, next); paint(row, id);
  fetch(API + '/react', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({offer_id: id, reaction: next, initData: T ? T.initData : ''})
  }).then(x => { if (!x.ok) throw 0; }).catch(() => {
    mine[id] = old; bump(id, next, old); paint(row, id);
  });
}
const $ = id => document.getElementById(id);
const fmt = d => d.slice(8,10) + '/' + d.slice(5,7);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function money(s){ return String(s || '').replace(/^UAH\s*([\d.,]+)$/, (m, x) => Math.round(parseFloat(x.replace(/,/g, ''))) + '₴'); }
function zeroOf(p){ if (!p) return ''; if (p.endsWith('₴')) return '0₴'; if (p.startsWith('$')) return '$0'; if (p.endsWith('€')) return '0€'; return '0'; }
function stateEl(o){
  const d = o.deal, g = o.give;
  const row = el('div', 'state');
  if (d) {
    row.append(el('b', null, '−' + d.pct + '%'), document.createTextNode(' · '), el('b', null, d.new), document.createTextNode(' '), el('s', null, d.old), document.createTextNode(' · ' + d.store));
    return row;
  }
  if (g) {
    const p = money(g.price);
    row.append(el('b', null, p ? zeroOf(p) : tr().free));
    if (p) row.append(document.createTextNode(' '), el('s', null, p));
    row.append(document.createTextNode(' · ' + g.store));
    return row;
  }
  return null;
}
function renderUI(){
  const tx = tr();
  document.documentElement.lang = lang;
  document.title = tx.title;
  $('h1').textContent = tx.title;
  $('hint').textContent = tx.hint;
  const sEl = $('sort');
  sEl.replaceChildren();
  Object.entries(tx.sorts).forEach(([k, v]) => {
    const opt = el('option', null, v);
    opt.value = k;
    sEl.append(opt);
  });
  sEl.value = sort;
  chips();
}
function render(){
  const tx = tr();
  const now = new Date();
  const t = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const list = offers.filter(o => o.status === 'active' && (!o.expires_at || o.expires_at >= t) && (cat === 'all' || o.category === cat));
  if (sort === 'rating') list.sort((a, b) => cs(b.id) - cs(a.id));
  else if (sort === 'ending') list.sort((a,b) => (a.expires_at || '9999').localeCompare(b.expires_at || '9999'));
  else list.sort((a,b) => b.found_at.localeCompare(a.found_at));
  const box = $('list'); box.replaceChildren();
  links.forEach((l, idx) => {
    if (l.category !== cat) return;
    if ((l.starts_at && l.starts_at > t) || (l.expires_at && l.expires_at < t)) return;
    const c = el('div', 'card pin');
    c.append(el('h3', null, (l.emoji || '🔗') + ' ' + (l.title[lang] || l.title.en || '')));
    c.append(el('div', null, l.text[lang] || l.text.en || ''));
    if (/^https?:/.test(l.url)) { const a = el('a', 'go', (l.button && (l.button[lang] || l.button.en)) || tx.open); a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; c.append(a); }
    if (IS_ADMIN) { const ab = el('button', 'adm', '⚙️'); ab.onclick = () => openBot('pin_' + idx); c.append(ab); }
    if (l.expires_at) { const m = el('div', 'meta'); m.append(el('span', null, tx.until + ' ' + fmt(l.expires_at))); c.append(m); }
    box.append(c);
  });
  if (!list.length) { box.append(el('div', 'empty', tx.empty)); return; }
  list.forEach(o => {
    const c = el('div', 'card');
    c.append(el('h3', null, o.title[lang] || o.title.en || ''));
    const st = (o.blurb && o.blurb[lang]) ? stateEl(o) : null;
    if (st) c.append(st);
    c.append(el('div', null, (o.blurb && o.blurb[lang]) || o.text[lang] || o.text.en || ''));
    if (/^https?:/.test(o.link)) { const a = el('a', 'go', tx.open); a.href = o.link; a.target = '_blank'; a.rel = 'noopener'; c.append(a); }
    if (IS_ADMIN) { const ab = el('button', 'adm', '⚙️'); ab.onclick = () => openBot('adm_' + o.id); c.append(ab); }
    if (o.expires_at) {
      const m = el('div', 'meta');
      m.append(el('span', null, tx.until + ' ' + fmt(o.expires_at)));
      c.append(m);
    }
    const rx = el('div', 'rx');
    RX.forEach(([k, e]) => { const b = el('button', 'rb', e); b.dataset.r = k; b.onclick = () => react(o.id, k, rx); rx.append(b); });
    paint(rx, o.id); c.append(rx); box.append(c);
  });
}
function chips(){
  const cats = tr().cats;
  const row = $('chips'); row.replaceChildren();
  Object.keys(cats).forEach(k => {
    const b = el('button', 'chip' + (k === cat ? ' on' : ''), cats[k]);
    b.onclick = () => { cat = k; store.set('cat', k); chips(); render(); };
    row.append(b);
  });
}
$('lang').value = lang;
$('sort').onchange = e => { sort = e.target.value; store.set('sort', sort); render(); };
$('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); renderUI(); render(); };
if (IS_ADMIN) { $('admBtn').style.display = ''; $('admBtn').onclick = () => openBot('admin'); }
renderUI();
fetch(API + '/counts').then(r => r.json()).then(d => { counts = d; render(); }).catch(() => {});
if (T && T.initData) fetch(API + '/mine', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({initData: T.initData})}).then(r => r.json()).then(d => { mine = d; render(); }).catch(() => {});
fetch('links.json?' + Date.now()).then(r => r.json()).then(d => { links = d; render(); }).catch(() => {});
fetch('offers.json?' + Date.now()).then(r => r.json()).then(d => { offers = d; render(); }).catch(e => { $('list').append(el('div', 'empty', tr().err + ((e && e.message) || e))); });
</script>
</body>
</html>
